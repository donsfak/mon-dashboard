version: '3.9'

services:
  # ============================================
  # Main Dashboard Service
  # ============================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        DOCKER_GID: "985"       # Must match: stat -c '%g' /var/run/docker.sock

    container_name: mediahub-dashboard
    restart: unless-stopped

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW       # Required for fping (ICMP ping)
    
    # Networking
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"      # React frontend
      - "${API_PORT:-3001}:3001"            # Express API
    
    environment:
      # Node
      NODE_ENV: production
      
      # API Configuration
      API_PORT: ${API_PORT:-3001}
      API_HOST: 0.0.0.0
      DOCKER_SOCK: /var/run/docker.sock
      
      # Tailscale (set in .env)
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY:-}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:-}
      
      # Orange CI / Network Testing
      ORANGE_TIMEOUT: ${ORANGE_TIMEOUT:-5000}
      
      # Vite Frontend Config
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}

      # Arr stack (set in .env)
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}

      # Jellyfin (set in .env)
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}

      # Jellyseerr (set in .env)
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      JELLYSEERR_USER_ID: ${JELLYSEERR_USER_ID:-}
      JELLYSEERR_INCLUDE_PENDING: ${JELLYSEERR_INCLUDE_PENDING:-false}

      # Gmail Integration (set in .env)
      GMAIL_ACCOUNTS: ${GMAIL_ACCOUNTS:-}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}

      # Comma-separated disk paths to monitor
      DISK_PATHS: ${DISK_PATHS:-/host_root,/mnt/Data}

      # Real-Debrid (optional — enables live status check)
      REAL_DEBRID_API_KEY: ${REAL_DEBRID_API_KEY:-}

      # qBittorrent
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}

      # Weather (OpenWeatherMap)
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      WEATHER_CITY: ${WEATHER_CITY:-}
      WEATHER_LAT: ${WEATHER_LAT:-5.3600}
      WEATHER_LON: ${WEATHER_LON:--4.0083}
    
    # Force Docker to use reliable public DNS (fixes Node.js EAI_AGAIN on bridge networks)
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # Allow container to reach host services (e.g. qBittorrent on host port 8090)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Volumes for data persistence and Docker socket access
    volumes:
      # Docker socket access (for monitoring)
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Host filesystem mounts for real disk monitoring
      - /:/host_root:ro
      - /mnt/Data:/mnt/Data:ro

      # Logs persistence
      - ./logs:/app/logs

      # Optional: Data persistence
      - dashboard-data:/app/data
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=dashboard"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - mediahub

  # ============================================
  # Optional: Watchtower for auto-updates
  # ============================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: mediahub-watchtower
    restart: unless-stopped
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    
    environment:
      # Check for updates every 6 hours
      WATCHTOWER_POLL_INTERVAL: 21600
      WATCHTOWER_CLEANUP: "true"
      # Only auto-update containers with label
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    
    networks:
      - mediahub
    
    # Only start if ENABLE_WATCHTOWER is true
    profiles:
      - monitoring

  # ============================================
  # Optional: Portainer for container management
  # ============================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: mediahub-portainer
    restart: unless-stopped
    
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    
    environment:
      TZ: ${TZ:-UTC}
    
    networks:
      - mediahub
    
    # Only start if ENABLE_PORTAINER is true
    profiles:
      - monitoring

# ============================================
# Networks
# ============================================
networks:
  mediahub:
    driver: bridge

# ============================================
# Volumes for persistence
# ============================================
volumes:
  dashboard-data:
    driver: local
  
  portainer-data:
    driver: local
